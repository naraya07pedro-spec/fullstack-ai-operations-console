# Temporary controlled generation on this isolated patch branch only; never run on main.
name: Temporary Vitest security lockfile generator
on:
  push:
    branches: [security/console-vitest-4-1-12-20261112]
permissions:
  contents: write
concurrency:
  group: patch-vitest-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: "startsWith(github.event.head_commit.message, 'chore(security): generate Vitest patch with npm 11')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install baseline, upgrade npm within isolated runner
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g npm@11 --ignore-scripts --no-audit --no-fund
          node --version
          npm --version
      - name: Generate and verify paired Vitest upgrade
        run: |
          npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund vitest@4.1.12 @vitest/coverage-v8@4.1.12
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          const l=JSON.parse(readFileSync('package-lock.json','utf8'));
          const expected=[
            ['node_modules/vitest','4.1.12'],['node_modules/@vitest/coverage-v8','4.1.12'],['node_modules/@vitest/mocker','4.1.12'],
            ['node_modules/fast-uri','4.2.3'],['node_modules/ajv/node_modules/fast-uri','3.1.9'],
            ['node_modules/fastify','5.12.8']
          ];
          for(const [path,version] of expected)if(l.packages?.[path]?.version!==version)throw Error('Unexpected lock version '+path+': '+l.packages?.[path]?.version);
          const next=Object.entries(l.packages).filter(([path])=>path.endsWith('/next')||path==='node_modules/next').map(([,v])=>v.version);
          if(next.length!==1||next[0]!=='16.4.3')throw Error('Unexpected Next.js lock version');
          if(p.devDependencies.vitest!=='4.1.12'||p.devDependencies['@vitest/coverage-v8']!=='4.1.12')throw Error('Manifest does not match paired patch');
          console.log(JSON.stringify({verified:true,vitest:'4.1.12',mocker:'4.1.12',fastUri:['3.1.9','4.2.3'],fastify:'5.12.8',next:'16.4.3'}));
          NODE
          git diff --check
          OTHER=$(git diff --name-only | grep -v -E '^(package.json|package-lock.json)$' || true)
          if [ -n "$OTHER" ]; then echo "Unexpected edited paths: $OTHER"; exit 1; fi
      - name: Static verification before pushing patch branch
        run: |
          npm run db:generate
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build:runtime
          npm run security:secrets
          mkdir -p artifacts/patch-evidence
          npm audit --json > artifacts/patch-evidence/audit.json || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('artifacts/patch-evidence/audit.json','utf8'));
          if(!a.metadata?.vulnerabilities)throw Error('Audit did not return parseable metadata');
          console.log(JSON.stringify({auditAtProposedHead:a.metadata.vulnerabilities}));
          NODE
      - name: Commit exact two dependency files to isolated branch
        run: |
          test "$GITHUB_REF" = "refs/heads/security/console-vitest-4-1-12-20261112"
          git add -- package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then echo "No expected upgrade changes"; exit 1; fi
          STAGED=$(git diff --cached --name-only)
          OTHER=$(printf '%s\n' "$STAGED" | grep -v -E '^(package.json|package-lock.json)$' || true)
          if [ -n "$OTHER" ]; then echo "Unexpected staged paths: $OTHER"; exit 1; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(tests): patch Vitest mocker advisory to 4.1.12"
          git push origin HEAD:refs/heads/security/console-vitest-4-1-12-20261112
