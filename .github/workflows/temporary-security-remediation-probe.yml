# Temporary read-only remediation probe. Does not commit, merge or alter any release gate.
name: Temporary isolated dependency remediation probe
on:
  push:
    branches:
      - security/console-audit-fix-probe-20261112
permissions:
  contents: read
jobs:
  probe:
    if: "startsWith(github.event.head_commit.message, 'chore(security): run isolated dependency remediation probe')"
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact PR base without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe compatible fixes without force or write permission
        id: patch
        run: |
          mkdir -p artifacts/security-probe
          npm audit --json > artifacts/security-probe/before.json || true
          set +e
          npm audit fix --ignore-scripts --no-fund > artifacts/security-probe/fix-output.txt 2>&1
          status=$?
          set -e
          echo "npm audit fix exit code: $status"
          npm audit --json > artifacts/security-probe/after.json || true
          git diff --stat
          git diff --check
          git diff -- package.json apps/web/package.json apps/api/package.json package-lock.json > artifacts/security-probe/candidate.patch
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const before=JSON.parse(readFileSync('artifacts/security-probe/before.json','utf8'));
          const after=JSON.parse(readFileSync('artifacts/security-probe/after.json','utf8'));
          const summary={baseSha:process.env.GITHUB_SHA, before:before.metadata?.vulnerabilities??null, after:after.metadata?.vulnerabilities??null, auditSource:'npm audit JSON (npm registry)', candidateOnly:true, noCommit:true, noMerge:true};
          writeFileSync('artifacts/security-probe/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary));
          if(!after.metadata?.vulnerabilities) throw Error('Missing after-audit counts');
          NODE
      - name: Verify installability and static checks of candidate
        if: steps.patch.outcome == 'success'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run db:generate
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build:runtime
          npm run security:secrets
      - name: Retain inspection artifacts without publishing or committing candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-isolated-remediation-probe-${{ github.sha }}
          path: |
            artifacts/security-probe/*
            package.json
            apps/web/package.json
            apps/api/package.json
            package-lock.json
          retention-days: 14
          if-no-files-found: error
