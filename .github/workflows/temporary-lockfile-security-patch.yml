# Temporary, branch-scoped reproducible npm lockfile regeneration.
# Remove this workflow before review/merge. Never runs on main.
name: Temporary Next.js security lockfile generation
on:
  push:
    branches:
      - security/next-16-4-3-patch-20261112
jobs:
  generate-lockfile:
    if: "startsWith(github.event.head_commit.message, 'chore(security): generate patched lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate package manifest and lockfile with npm, no scripts
        run: |
          npm install --workspace @console/web --save-exact --ignore-scripts --no-audit --no-fund next@16.4.3
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('apps/web/package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const matches = Object.entries(lock.packages ?? {}).filter(([p]) => p === 'node_modules/next' || p.endsWith('/node_modules/next')).map(([p, v]) => ({path:p, version:v.version}));
          console.log(JSON.stringify({manifest:manifest.dependencies?.next, installedNext:matches}));
          if (manifest.dependencies?.next !== '16.4.3' || matches.length === 0 || matches.some((p) => p.version !== '16.4.3')) {
            throw new Error('Requested exact Next.js 16.4.3 not fully resolved by npm.');
          }
          NODE
          git diff --check
          EXTRA_FILES=$(git diff --name-only | grep -v -E '^(apps/web/package.json|package-lock.json)$' || true)
          if [ -n "$EXTRA_FILES" ]; then echo "Unexpected changed files: $EXTRA_FILES"; exit 1; fi
          git diff --stat
      - name: Prove lockfile is installable, without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only npm-generated dependency files to isolated branch
        run: |
          test "$GITHUB_REF" = "refs/heads/security/next-16-4-3-patch-20261112"
          git add -- apps/web/package.json package-lock.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(web): upgrade vulnerable Next.js to 16.4.3'
          git push origin HEAD:refs/heads/security/next-16-4-3-patch-20261112
